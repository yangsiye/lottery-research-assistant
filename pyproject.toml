[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"

[project]
name="lottery-research-assistant"
version="1.5.0"
description="Auditable SSQ/DLT research assistant"
requires-python=">=3.10"
dependencies=["numpy>=1.26","pandas>=2.2","scipy>=1.13","scikit-learn>=1.5","requests>=2.32","joblib>=1.4"]

[project.scripts]
lottery-assistant="lottery_assistant.cli:main"
