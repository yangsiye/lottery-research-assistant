name: Legacy Lottery installer (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired installer
        run: |
          echo '::error::This one-time ZIP installer is retired. It could overwrite immutable production state and delete the active scheduler. Use Lottery Research Assistant Cloud to run the existing installation; update source code through normal commits.'
          exit 1
