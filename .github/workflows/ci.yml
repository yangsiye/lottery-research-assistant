name: Lottery CI

on:
  push:
    branches: [main]
    paths:
      - 'lottery_assistant/**'
      - 'tests/**'
      - 'chatgpt_bridge.py'
      - 'pyproject.toml'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
