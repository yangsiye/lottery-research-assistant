name: Lottery Research Assistant Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lottery-cloud.yml'
      - 'lottery_assistant/**'
      - 'config/**'
      - 'requirements.txt'
      - 'chatgpt_bridge.py'
  schedule:
    - cron: '30 8 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '30 15 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '0 23 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: lottery-research-assistant-cloud
  cancel-in-progress: false

jobs:
  run-cloud-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout persistent state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Initialize database
        run: python -m lottery_assistant.cli init-db

      - name: Run due six-module cloud cycle
        id: cloud
        run: python -m lottery_assistant.cli cloud

      - name: Build ChatGPT bridge payload
        if: always() && steps.cloud.outcome != 'skipped'
        run: python chatgpt_bridge.py

      - name: Save inspectable cloud artifacts
        if: always() && steps.cloud.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: lottery-state-${{ github.run_id }}
          path: |
            data/lottery.db
            reports/
            bridge/
          retention-days: 14

      - name: Persist database, reports and research state
        if: always() && steps.cloud.outcome != 'skipped'
        run: |
          git config user.name "lottery-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/lottery.db reports/latest_cloud_run.json
          git add reports bridge research
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore(cloud): persist lottery research state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
