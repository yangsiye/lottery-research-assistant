name: Lottery Research Assistant Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lottery-cloud.yml'
      - 'lottery_assistant/**'
      - 'config/**'
      - 'requirements.txt'
      - 'chatgpt_bridge.py'
  schedule:
    # Explicit UTC; Beijing = UTC+8. Cron is best effort, never a delivery SLA.
    # Prepare after morning sync, then retry before the 16:00 frontend run.
    - cron: '37 0 * * *'         # 08:37 Beijing
    - cron: '7 4,6 * * *'        # 12:07 / 14:07
    - cron: '37 6 * * *'        # 14:37
    - cron: '7,30,45 7 * * *'   # 15:07 / 15:30 / 15:45
    - cron: '45 10 * * *'       # 18:45 recovery; never creates after 20:00
    - cron: '7,37 15 * * *'     # 23:07 / 23:37 official-result review retries

permissions:
  contents: write

concurrency:
  group: lottery-research-assistant-cloud
  cancel-in-progress: false

jobs:
  run-cloud-cycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONPATH: ${{ github.workspace }}
      LOTTERY_TRIGGER_SCHEDULE: ${{ github.event.schedule }}

    steps:
      - name: Checkout persistent state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Queued runs must load the latest persisted freeze, not their event SHA.
          ref: main

      - name: Record scheduler and checkout evidence
        run: printf 'LOTTERY_CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Initialize database
        run: python -m lottery_assistant.cli init-db

      - name: Run due six-module cloud cycle
        id: cloud
        run: python -m lottery_assistant.cli cloud

      - name: Build ChatGPT bridge payload
        if: always() && steps.cloud.outcome != 'skipped'
        run: python chatgpt_bridge.py

      - name: Save inspectable cloud artifacts
        if: always() && steps.cloud.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: lottery-state-${{ github.run_id }}
          path: |
            data/lottery.db
            reports/
            bridge/
          retention-days: 14

      - name: Persist database, reports and research state
        if: always() && steps.cloud.outcome != 'skipped'
        run: |
          git config user.name "lottery-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/lottery.db reports/latest_cloud_run.json
          git add reports bridge research
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore(cloud): persist lottery research state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
